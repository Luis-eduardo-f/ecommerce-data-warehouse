version: 2

sources:
  - name: raw
    description: >
      Minimally-typed raw tables loaded by scripts/load_raw.py directly from
      the synthetic seed CSVs. Every column is stored as TEXT; typing and
      cleaning happen in the staging layer below.
    schema: raw
    tables:
      - name: raw_customers
        description: One row per customer, as generated by generate_seed_data.py.
      - name: raw_products
        description: One row per product in the catalog.
      - name: raw_orders
        description: One row per order placed by a customer.
      - name: raw_order_items
        description: One row per line item within an order.

models:
  - name: stg_customers
    description: Cleaned, typed view over raw.raw_customers. One row per customer.
    columns:
      - name: customer_id
        description: Primary key. Surrogate integer id of the customer.
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: Customer's full name.
        data_tests:
          - not_null
      - name: email
        description: Customer's email address, lower-cased.
        data_tests:
          - unique
          - not_null
      - name: signup_date
        description: Date the customer signed up.
        data_tests:
          - not_null
      - name: country
        description: Customer's country of residence.
        data_tests:
          - not_null

  - name: stg_products
    description: Cleaned, typed view over raw.raw_products. One row per product.
    columns:
      - name: product_id
        description: Primary key. Surrogate integer id of the product.
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: Human-readable product name.
        data_tests:
          - not_null
      - name: category
        description: Product category (e.g. Electronics, Clothing).
        data_tests:
          - not_null
      - name: unit_price
        description: Current catalog price of the product.
        data_tests:
          - not_null

  - name: stg_orders
    description: Cleaned, typed view over raw.raw_orders. One row per order.
    columns:
      - name: order_id
        description: Primary key. Surrogate integer id of the order.
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: Foreign key to stg_customers.customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_date
        description: Date the order was placed.
        data_tests:
          - not_null
      - name: order_status
        description: Current status of the order.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled']

  - name: stg_order_items
    description: >
      Cleaned, typed view over raw.raw_order_items. One row per order line
      item (the grain later carried through to fact_orders).
    columns:
      - name: order_item_id
        description: Primary key. Surrogate integer id of the order item.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Foreign key to stg_orders.order_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        description: Foreign key to stg_products.product_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: quantity
        description: Number of units purchased for this line item.
        data_tests:
          - not_null
      - name: unit_price
        description: Price paid per unit at the time of purchase.
        data_tests:
          - not_null
