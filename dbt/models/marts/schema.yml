version: 2

models:
  - name: dim_customers
    description: >
      Customer dimension. One row per customer, enriched with lifetime
      order-count and revenue metrics computed from fact_orders.
    columns:
      - name: customer_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: email
        description: Customer's email address.
        data_tests:
          - unique
          - not_null
      - name: lifetime_order_count
        description: Total number of orders placed by this customer (0 if none).
        data_tests:
          - not_null
      - name: lifetime_revenue
        description: Total revenue generated by this customer across all orders.
        data_tests:
          - not_null

  - name: dim_products
    description: >
      Product dimension. One row per product, enriched with lifetime
      units-sold and revenue metrics computed from fact_orders.
    columns:
      - name: product_id
        description: Primary key.
        data_tests:
          - unique
          - not_null
      - name: current_unit_price
        description: Current catalog price of the product.
        data_tests:
          - not_null
      - name: total_units_sold
        description: Total quantity of this product sold across all orders (0 if none).
        data_tests:
          - not_null

  - name: fact_orders
    description: >
      Central fact table. Grain: one row per order line item
      (order_item_id). Foreign keys to dim_customers (via customer_id) and
      dim_products (via product_id).
    columns:
      - name: order_item_id
        description: Primary key. One row per order line item.
        data_tests:
          - unique
          - not_null
      - name: order_id
        description: Identifier of the order this line item belongs to.
        data_tests:
          - not_null
      - name: customer_id
        description: Foreign key to dim_customers.customer_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
      - name: product_id
        description: Foreign key to dim_products.product_id.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: order_date
        description: Date the parent order was placed.
        data_tests:
          - not_null
      - name: order_status
        description: Status of the parent order at load time.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['pending', 'processing', 'shipped', 'delivered', 'cancelled']
      - name: quantity
        description: Units of the product purchased in this line item.
        data_tests:
          - not_null
      - name: unit_price
        description: Price paid per unit at the time of purchase.
        data_tests:
          - not_null
      - name: line_total
        description: quantity * unit_price for this line item.
        data_tests:
          - not_null

  - name: mart_revenue_by_month
    description: >
      Monthly revenue rollup with a 3-month moving average and
      month-over-month change, computed with window functions.
      Excludes cancelled orders.
    columns:
      - name: order_month
        description: First day of the calendar month.
        data_tests:
          - unique
          - not_null
      - name: monthly_revenue
        description: Total revenue recognized in the month.
        data_tests:
          - not_null

  - name: mart_top_products
    description: >
      Product sales ranking, overall and within category, computed with
      window functions. Excludes cancelled orders.
    columns:
      - name: product_id
        description: Foreign key to dim_products.product_id.
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: revenue_rank
        description: Rank of this product by total_revenue across the whole catalog.
        data_tests:
          - not_null
