services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce_dwh_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dwh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwh_password}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce_dwh}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dwh_user} -d ${POSTGRES_DB:-ecommerce_dwh}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    name: ecommerce_dwh_pgdata
